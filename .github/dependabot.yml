# 依赖更新机器人：仅 devDependencies（本仓库 dependencies 恒为空，见 ADR-0002）。
# Electron 升级影响打包链路与原生能力，单独人工评估，不自动开 PR。
# vite / TypeScript / React 锁定当前大版本线（AGENTS 技术栈），只放行 patch/minor。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: development
    ignore:
      - dependency-name: electron
      - dependency-name: vite
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        patterns:
          - '*'
