# 依赖更新机器人：仅 devDependencies（本仓库 dependencies 恒为空，见 ADR-0002）。
# 应用仓库不追大版本：major 一律人工评估（PR #19 曾把 eslint 10 / vitest 5 / electron-vite 6
# 一把梭，新 lint 规则 + 未验证的构建链变更同时进场，CI 无法定位单包责任）。
# Electron 升级另影响打包链路与原生能力，完全关闭自动 PR。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    allow:
      - dependency-type: development
    ignore:
      - dependency-name: electron
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    groups:
      dev-dependencies:
        patterns:
          - '*'
