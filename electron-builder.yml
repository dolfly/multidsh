# 本地打包配置。公开发布策略见 docs/release-policy.md。
appId: dev.dshhub.desktop
productName: DSH Hub
# `electron` 已随 devDependencies 安装。复用其解压分发包可避免 builder 在每次
# macOS 打包时额外访问 GitHub；离线或网络抖动环境仍可稳定出包。
electronDist: node_modules/electron/dist
# NSIS 工具链用统一 bundle（makensis 3.12 + 插件一档打包，入口脚本自设 NSISDIR）：
# legacy 3.0.4.1 的 mac 端 makensis 只有 x86_64，在未装 Rosetta 的 Apple Silicon 上
# 打包直接失败（spawn EBADCPU）；统一 bundle 按 uname 选 mac/arm64 原生二进制。
toolsets:
  nsis: '1.2.1'
directories:
  buildResources: build
  output: dist
# 本地构建仍会生成更新元数据；它们仅供本机验证与将来的已签名发布使用，
# 不是当前 GitHub source-only Release 的资产。
generateUpdatesFilesForAllChannels: false
# 只随包 out/ 与 package.json;源码、测试、docs 不入包
files:
  - out/**
  - package.json
extraResources:
  # trayIconPath() 优先读 process.resourcesPath/<name>；macOS 用模板图，Windows/Linux 用彩色图
  - from: resources/trayTemplate.png
    to: trayTemplate.png
  - from: resources/trayTemplate@2x.png
    to: trayTemplate@2x.png
  - from: resources/tray.png
    to: tray.png
  - from: resources/tray@2x.png
    to: tray@2x.png
  # 随包分发 npm：运行时安装经应用自带 Node（ELECTRON_RUN_AS_NODE）跑 npm-cli.js，
  # 打包产物不再依赖目标机装有 Node/npm（尤见 Windows「未找到 npm」）。
  # 源目录 build/npm-runtime/npm 由 `pnpm bundle:npm` 解引用生成（pnpm 的符号链接
  # 无法被 electron-builder 递归复制）。用 `from: build/npm-runtime, to: .` 复制整个
  # 暂存根：electron-builder 会过滤复制源**根部**的 node_modules，但子目录
  # `npm/node_modules` 得以保留；resolveBundledNpm() 读 process.resourcesPath/npm/bin/npm-cli.js。
  - from: build/npm-runtime
    to: .
    filter:
      - '**/*'
      - '!**/{test,tests,docs,man,changelogs}/**'
      - '!**/*.md'
  # 随包分发 JS 版 pnpm（10.x）：dsh 插件管理转发 pnpm，目标机未必装 pnpm，装了也可能是
  # pnpm v12 的全局 shim（nvm 等环境下完整性校验失败）。由 `pnpm bundle:pnpm` 下载发布 tarball
  # 到 build/pnpm-runtime/pnpm；主进程物化启动器并前置 PATH，令 dsh 用这份自带 pnpm。
  # 嵌套一层目录避免 electron-builder 过滤复制源根部 node_modules（pnpm 的在 pnpm/dist/node_modules）。
  - from: build/pnpm-runtime
    to: pnpm-runtime
    filter:
      - '**/*'
      - '!**/{test,tests,docs,man,changelogs}/**'
      - '!**/*.md'
mac:
  icon: build/icon.icns
  # 只保留应用实际支持的 Chromium 语言包，控制包体积。
  # 「跟随系统」语言由主进程 OS preferred languages 解析，不依赖这里的 .lproj。
  # 应用 UI 翻译由 app.asar 内的 i18n 模块处理（仅 zh/en），不受此处影响。
  electronLanguages:
    - en
    - zh_CN
  category: public.app-category.developer-tools
  # 默认仅输出解包的 .app，避免本地验证额外生成 dmg / zip。
  target:
    - dir
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
win:
  icon: build/icon.ico
  # 只保留应用实际支持的 Chromium 语言包（与 mac 一致），控制包体积并避免安装后
  # 出现大量无关 .pak 语言文件。应用 UI 翻译由 app.asar 内的 i18n 模块处理（仅 zh/en）。
  electronLanguages:
    - en
    - zh-CN
  target:
    - nsis
  # 资产名不带空格：GitHub Release 上传时会把空格归一化成点号，
  # 与发布说明、SHA256SUMS.txt 中的名字不一致。连字符形态三处统一。
  artifactName: DSH-Hub-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 辅助安装器默认预选「为所有用户安装」（Program Files + UAC），
  # 页面上仍可切换为仅当前用户；安装目录由用户在向导中选择。
  selectPerMachineByDefault: true
